<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoSentinel Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
        body { font-family: 'Fira Code', monospace; background-color: #0d1117; color: #c9d1d9; }
        .verdict-block { background-color: #2a0a0a; color: #ff7b72; border: 1px solid #ff7b72; box-shadow: 0 0 10px rgba(255,123,114,0.4); }
        .verdict-allow { background-color: #0d2a1c; color: #7ee787; border: 1px solid #7ee787; }
        .verdict-sandbox { background-color: #2a210d; color: #e3b341; border: 1px solid #e3b341; }
        .card-bg { background-color: #161b22; border: 1px solid #30363d; }
        
        /* Subtle scanline effect for that hacker vibe */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Print Settings to remove URL headers and fix margins */
        @media print {
            @page { margin: 0; size: auto; }
            body { margin: 1cm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="relative min-h-screen pb-10">
    <!-- Navbar -->
    <nav class="card-bg p-4 shadow-lg sticky top-0 z-10 border-b border-gray-700">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl md:text-2xl font-bold flex items-center tracking-widest uppercase text-center md:text-left">
                <span class="text-red-500 mr-3">🛡️ RepoSentinel</span>
            </h1>
            <div class="flex gap-4">
                <button onclick="window.print()" class="no-print text-xs bg-gray-800 text-gray-300 hover:text-white border border-gray-600 hover:bg-gray-700 px-3 py-1.5 rounded transition hidden md:block">
                    📄 EXPORT REPORT
                </button>
                <span class="text-xs md:text-sm bg-gray-800 px-4 py-1.5 border border-green-500 rounded-sm text-green-400 flex items-center shadow-[0_0_10px_rgba(74,222,128,0.3)]">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-3 animate-ping"></span>
                    SYSTEM ACTIVE
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-4 md:p-6 mt-4 relative z-10">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
            <div class="card-bg p-4 md:p-6 rounded-md shadow-lg border-l-4 border-l-blue-500 transition">
                <h3 class="text-gray-400 text-[10px] md:text-xs font-semibold uppercase tracking-widest">Total Intercepts</h3>
                <p id="stat-total" class="text-2xl md:text-4xl font-bold mt-2 text-white">0</p>
            </div>
            <div class="card-bg p-4 md:p-6 rounded-md shadow-lg border-l-4 border-l-green-500 transition">
                <h3 class="text-gray-400 text-[10px] md:text-xs font-semibold uppercase tracking-widest">Allowed Actions</h3>
                <p id="stat-allow" class="text-2xl md:text-4xl font-bold mt-2 text-green-400">0</p>
            </div>
            <div class="card-bg p-4 md:p-6 rounded-md shadow-lg border-l-4 border-l-red-500 transition relative overflow-hidden">
                <div class="absolute -right-2 -top-2 md:-right-4 md:-top-4 text-red-500 opacity-10 text-6xl md:text-8xl">☠</div>
                <h3 class="text-gray-400 text-[10px] md:text-xs font-semibold uppercase tracking-widest relative">Blocked Threats</h3>
                <p id="stat-block" class="text-2xl md:text-4xl font-bold mt-2 text-red-500 relative">0</p>
            </div>
            <div class="card-bg p-4 md:p-6 rounded-md shadow-lg border-l-4 border-l-yellow-500 transition">
                <h3 class="text-gray-400 text-[10px] md:text-xs font-semibold uppercase tracking-widest">Sandboxed</h3>
                <p id="stat-sandbox" class="text-2xl md:text-4xl font-bold mt-2 text-yellow-500">0</p>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="card-bg rounded-md shadow-2xl overflow-hidden">
            <div class="bg-[#1f2428] px-4 md:px-6 py-4 border-b border-gray-700 flex flex-col md:flex-row justify-between items-center gap-3">
                <h2 class="text-sm md:text-lg font-bold text-gray-200 tracking-wider">LIVE INTERCEPTION FEED</h2>
                <button onclick="fetchLogs()" class="no-print w-full md:w-auto text-xs bg-gray-800 text-blue-400 hover:text-white border border-blue-500 hover:bg-blue-600 px-4 py-2 rounded transition shadow-[0_0_8px_rgba(59,130,246,0.3)]">
                    [ REFRESH FEED ]
                </button>
            </div>
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-[#0d1117] text-gray-500 text-[10px] md:text-xs uppercase tracking-widest">
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal">Timestamp</th>
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal">Vector</th>
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal">Payload Snippet</th>
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal">Triggered Flags</th>
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal text-center">Threat Score</th>
                            <th class="p-3 md:p-4 border-b border-gray-800 font-normal text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body" class="divide-y divide-gray-800">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-gray-500 animate-pulse">Establishing connection...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Dynamically get the host so it works on mobile IP too
        let host = window.location.hostname;
        if (!host || host === "") {
            host = "localhost"; // If opened directly via file:/// on PC
        }
        const API_URL = `http://${host}:8000/api/logs`;

        function getVerdictClass(verdict) {
            if(verdict === 'block') return 'verdict-block animate-pulse';
            if(verdict === 'allow') return 'verdict-allow';
            return 'verdict-sandbox';
        }

        async function fetchLogs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderLogs(data.logs);
                updateStats(data.logs);
            } catch (error) {
                console.error("Failed to fetch logs:", error);
                document.getElementById('logs-body').innerHTML = `
                    <tr><td colspan="6" class="p-8 text-center text-red-500 font-bold border border-red-500 m-4 block bg-red-900/20">
                        [CONNECTION ERROR] Backend API unreachable. (Make sure you use the PC's local IP on mobile!)
                    </td></tr>
                `;
            }
        }

        function updateStats(logs) {
            document.getElementById('stat-total').innerText = logs.length;
            document.getElementById('stat-allow').innerText = logs.filter(l => l.verdict === 'allow').length;
            document.getElementById('stat-block').innerText = logs.filter(l => l.verdict === 'block').length;
            document.getElementById('stat-sandbox').innerText = logs.filter(l => l.verdict === 'sandbox').length;
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logs-body');
            if (logs.length === 0) return;

            tbody.innerHTML = '';
            
            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#1f2428] transition-colors duration-150';
                
                const flagsHtml = log.flags.map(f => `<span class="inline-block bg-gray-800 text-gray-300 px-2 py-1 mb-1 mr-1 text-[9px] md:text-[10px] uppercase tracking-wider rounded border border-gray-600">${f}</span>`).join('');
                
                // Logic to show original vs sanitized content
                let displaySnippet = log.content_snippet;
                let isSanitized = log.sanitized_content && !log.sanitized_content.startsWith(log.content_snippet.replace("...", "")) && log.sanitized_content.includes("[REDACTED");
                
                if (log.sanitized_content && log.sanitized_content.includes("[REDACTED_AWS_ACCESS_KEY]")) {
                    isSanitized = true;
                    displaySnippet = log.sanitized_content.length > 100 ? log.sanitized_content.substring(0, 100) + "..." : log.sanitized_content;
                } else if (log.sanitized_content && log.sanitized_content.includes("[BLOCKED_BY_REPOSENTINEL]")) {
                    isSanitized = true;
                    displaySnippet = log.sanitized_content.length > 100 ? log.sanitized_content.substring(0, 100) + "..." : log.sanitized_content;
                }
                
                let snippetHtml = `<span title="${log.content_snippet.replace(/"/g, '&quot;')}">${displaySnippet}</span>`;
                if (isSanitized) {
                    snippetHtml = `
                        <div class="text-xs text-red-400 line-through mb-1" title="Original: ${log.content_snippet.replace(/"/g, '&quot;')}">${log.content_snippet}</div>
                        <div class="text-green-400 font-bold flex items-center">
                            <span class="mr-1">✨</span> ${displaySnippet}
                        </div>
                    `;
                }

                tr.innerHTML = `
                    <td class="p-3 md:p-4 text-[10px] md:text-xs text-gray-400 whitespace-nowrap">${log.timestamp}</td>
                    <td class="p-3 md:p-4 text-[10px] md:text-xs font-bold text-blue-400 uppercase tracking-widest">${log.source_type}</td>
                    <td class="p-3 md:p-4 text-xs md:text-sm text-gray-300 max-w-[200px] md:max-w-md truncate whitespace-normal">${snippetHtml}</td>
                    <td class="p-3 md:p-4 text-sm leading-tight">${flagsHtml || '<span class="text-gray-600 italic">None</span>'}</td>
                    <td class="p-3 md:p-4 text-center">
                        <span class="font-bold text-base md:text-lg ${log.risk_score >= 80 ? 'text-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.8)]' : (log.risk_score > 0 ? 'text-yellow-500' : 'text-green-500')}">
                            ${log.risk_score}
                        </span>
                    </td>
                    <td class="p-3 md:p-4 text-center">
                        <span class="inline-block px-2 md:px-3 py-1 rounded text-[10px] md:text-xs font-bold uppercase tracking-widest whitespace-nowrap ${getVerdictClass(log.verdict)}">
                            [${log.verdict}]
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        fetchLogs();
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
